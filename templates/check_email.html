{% extends "base.html" %}

{% block title %}Check your email · {{ app_name }}{% endblock %}

{% block content %}
<div class="auth">
    <h1>Check your email</h1>
    <div class="card tape">
        <p>If that address can sign in, a link is on its way. Tap it on this device.</p>
        <p class="muted">It works once, for 15 minutes. Nothing there? Check spam, or <a href="{{ url_for('main.login') }}">send another</a>.</p>
    </div>
</div>
{% endblock %}
